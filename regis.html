<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Daftar - HunianKu</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page">
<div class="auth-shell">
  <div class="auth-visual" style="background-image:linear-gradient(rgba(11,24,48,.58),rgba(11,24,48,.78)),url('https://images.unsplash.com/photo-1560185008-b033106af5c3?auto=format&fit=crop&w=900&q=85')"><div><a class="logo" style="color:#fff" href="index.html">HunianKu</a></div><div><span class="badge">Buat Akun</span><h1>Mulai Cari Hunian Impianmu</h1><p>Daftar sebagai pencari hunian dan nikmati proses pencarian yang lebih mudah.</p></div></div>
  <div class="auth-form"><h2>Daftar Akun</h2><p class="sub">Lengkapi data untuk membuat akun baru.</p>
    <form onsubmit="return false">
      <div class="form-group"><label>Nama Lengkap</label><input class="form-control" type="text" placeholder="Nama lengkap"></div>
      <div class="form-group"><label>Email</label><input class="form-control" type="email" placeholder="nama@email.com"></div>
      <div class="form-row"><div class="form-group"><label>Password</label><input class="form-control" type="password" placeholder="Password"></div><div class="form-group"><label>Konfirmasi</label><input class="form-control" type="password" placeholder="Ulangi password"></div></div>
      <div class="form-group"><label>Daftar sebagai</label><select class="form-control"><option>Pencari Hunian</option><option>Pemilik Properti</option></select></div>
      <button class="btn btn-primary" type="submit">Buat Akun</button>
    </form>
    <p class="auth-note">Sudah punya akun? <a class="small-link" href="login.html">Masuk di sini</a></p>
  </div>
</div>
</body></html>
